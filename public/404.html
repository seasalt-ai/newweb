<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      (function() {
        try {
          // Store full path (pathname + search + hash)
          var fullPath = window.location.pathname + window.location.search + window.location.hash;
          sessionStorage.setItem('redirectPath', fullPath);
          // Also pass it via query param for robustness (in case sessionStorage isn't available)
          var encoded = encodeURIComponent(fullPath);
          // Redirect to the root with preserved path as ?p=
          window.location.replace('/?p=' + encoded);
          return;
        } catch (e) {
          // If anything goes wrong, fall back to simple root redirect
          window.location.replace('/');
          return;
        }
      })();
    </script>
    <noscript>
      <!-- Fallback for users/bots without JavaScript: go to English -->
      <meta http-equiv="refresh" content="0; url=/en/">
    </noscript>
  </head>
  <body>
    <p>If you are not redirected automatically, <a href="/">click here</a>.</p>
  </body>
</html>
